name: RaceDay Part 1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/RaceDay_Database.sql
          test -d docs
          test -d .github/workflows

      - name: Validate SQL file
        run: |
          test -s docs/RaceDay_Database.sql

      - name: CI validation successful
        run: echo "RaceDay Part 1 repository validation passed."