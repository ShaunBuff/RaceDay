
name: RaceDay API CI

on:
  push:
    branches: [main, master, part2-api]
  pull_request:
    branches: [main, master, part2-api]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore RaceDay.slnx

      - name: Build solution
        run: dotnet build RaceDay.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
